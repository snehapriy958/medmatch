spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.security: WARN
    org.springframework.security.oauth2: WARN
    org.hibernate: WARN
    org.flywaydb: INFO
    com.medmatch: INFO

  pattern:
    console: >
      %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}
      %-5level
      [%X{requestId:-N/A}]
      [%thread]
      %logger{36}
      - %msg%n

server:
  port: 8081

  shutdown: graceful

  forward-headers-strategy: framework

  compression:
    enabled: true
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/plain
      - text/css
      - application/javascript
    min-response-size: 1024

  error:
    include-message: never
    include-binding-errors: never