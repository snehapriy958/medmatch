server:
  port: 8081


spring:
  application:
    name: auth-service


  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/medmatch}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false


  flyway:
    enabled: true
    locations: classpath:db/migration


jwt:
  private-key: ${JWT_PRIVATE_KEY_PATH:classpath:keys/private.pem}
  public-key: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}
  expiration: ${JWT_EXPIRATION:3600000}


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - info


  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true


logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN