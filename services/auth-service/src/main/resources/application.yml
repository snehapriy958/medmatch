spring:
  application:
    name: auth-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8081

rsa:
  private-key: ${RSA_PRIVATE_KEY_LOCATION:classpath:keys/private_key.pem}
  public-key: ${RSA_PUBLIC_KEY_LOCATION:classpath:keys/public_key.pem}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  info:
    env:
      enabled: false