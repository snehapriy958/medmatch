apiVersion: apps/v1
kind: Deployment
metadata:
  name: medmatch-celery-worker
  namespace: medmatch
  labels:
    app.kubernetes.io/name: medmatch-celery-worker
    app.kubernetes.io/part-of: medmatch-platform
    app.kubernetes.io/component: background-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: medmatch-celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medmatch-celery-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: celery-worker
          image: medmatch/ai-service:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["celery", "-A", "app.celery.celery_app", "worker", "--loglevel=info", "-c", "2"]
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: medmatch-secrets
                  key: redis-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: medmatch-secrets
                  key: database-url
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: medmatch-secrets
                  key: celery-broker-url
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: medmatch-secrets
                  key: celery-result-backend
            - name: JWT_PUBLIC_KEY_PATH
              value: "/app/keys/public.pem"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: jwt-public-key
              mountPath: /app/keys
              readOnly: true
            - name: upload-storage
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: jwt-public-key
          secret:
            secretName: medmatch-jwt-public-key
        - name: upload-storage
          persistentVolumeClaim:
            claimName: medmatch-uploads-pvc
