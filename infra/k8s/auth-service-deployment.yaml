apiVersion: apps/v1
kind: Deployment
metadata:
  name: medmatch-auth-service
  namespace: medmatch
  labels:
    app.kubernetes.io/name: medmatch-auth-service
    app.kubernetes.io/part-of: medmatch-platform
    app.kubernetes.io/component: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: medmatch-auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medmatch-auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: auth-service
          image: medmatch/auth-service:latest
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "production"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: medmatch-secrets
                  key: spring-datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: medmatch-secrets
                  key: postgres-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medmatch-secrets
                  key: postgres-password
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/keys
              readOnly: true
      volumes:
        - name: jwt-keys
          secret:
            secretName: medmatch-jwt-keypair
---
apiVersion: v1
kind: Service
metadata:
  name: medmatch-auth-service
  namespace: medmatch
  labels:
    app.kubernetes.io/name: medmatch-auth-service
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  selector:
    app.kubernetes.io/name: medmatch-auth-service
