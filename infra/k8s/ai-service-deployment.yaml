apiVersion: apps/v1
kind: Deployment
metadata:
  name: medmatch-ai-service
  namespace: medmatch
  labels:
    app.kubernetes.io/name: medmatch-ai-service
    app.kubernetes.io/part-of: medmatch-platform
    app.kubernetes.io/component: backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: medmatch-ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medmatch-ai-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: ai-service
          image: medmatch/ai-service:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: medmatch-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: medmatch-secrets
                  key: redis-url
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: medmatch-secrets
                  key: celery-broker-url
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: medmatch-secrets
                  key: celery-result-backend
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: medmatch-secrets
                  key: google-api-key
            - name: JWT_PUBLIC_KEY_PATH
              value: "/app/keys/public.pem"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: jwt-public-key
              mountPath: /app/keys
              readOnly: true
            - name: upload-storage
              mountPath: /app/uploads
      volumes:
        - name: jwt-public-key
          secret:
            secretName: medmatch-jwt-public-key
        - name: upload-storage
          persistentVolumeClaim:
            claimName: medmatch-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: medmatch-ai-service
  namespace: medmatch
  labels:
    app.kubernetes.io/name: medmatch-ai-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: medmatch-ai-service
