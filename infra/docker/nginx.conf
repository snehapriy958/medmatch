worker_processes auto;

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {

    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    access_log /tmp/nginx/access.log;
    error_log /tmp/nginx/error.log;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;

    server {

        listen 5173;

        server_name _;

        root /usr/share/nginx/html;

        index index.html;


        # ============================================================
        # FastAPI Patient endpoints
        #
        # Browser:
        # /api/patients
        #
        # Backend:
        # http://ai-service:8000/api/patients
        # ============================================================
        location /api/patients {

            proxy_pass http://ai-service:8000;

            proxy_http_version 1.1;

            proxy_set_header Host ai-service:8000;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
        }


        # ============================================================
        # FastAPI Trial endpoints
        #
        # Browser:
        # /api/trials
        #
        # Backend:
        # http://ai-service:8000/api/trials
        # ============================================================
        location /api/trials {

            proxy_pass http://ai-service:8000;

            proxy_http_version 1.1;

            proxy_set_header Host ai-service:8000;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
        }


        # ============================================================
        # Spring Boot User endpoints
        #
        # Browser:
        # /api/auth/users/me
        #
        # Backend:
        # /users/me
        # ============================================================
        location /api/auth/users/ {

            proxy_pass http://auth-service:8081/users/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
        }


        # ============================================================
        # Spring Boot Dashboard endpoints
        #
        # Browser:
        # /api/auth/dashboard/system
        #
        # Backend:
        # http://auth-service:8081/dashboard/system
        # ============================================================
        location /api/auth/dashboard/ {

            proxy_pass http://auth-service:8081/dashboard/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
        }


        # ============================================================
        # Spring Boot Audit Log endpoints
        #
        # Browser:
        # /api/auth/audit-logs/user/{userId}
        #
        # Backend:
        # /audit-logs/user/{userId}
        # ============================================================
        location /api/auth/audit-logs/ {

            proxy_pass http://auth-service:8081/audit-logs/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
        }


        # ============================================================
        # Spring Boot Auth endpoints
        #
        # Browser:
        # /api/auth/login
        #
        # Backend:
        # /auth/login
        # ============================================================
        location /api/auth/ {

            proxy_pass http://auth-service:8081/auth/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
        }


        # ============================================================
        # FastAPI AI Service
        #
        # Browser:
        #   /api/ai/api/matching/search
        #
        # Backend:
        #   /api/matching/search
        # ============================================================
        location /api/ai/ {

            proxy_pass http://ai-service:8000/;

            proxy_http_version 1.1;

            proxy_set_header Host ai-service:8000;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
        }

        # ============================================================
        # Spring Boot Application API
        # ============================================================
        location /api/ {

            proxy_pass http://auth-service:8081/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
        }


        # ============================================================
        # React SPA
        # ============================================================
        location / {

            try_files $uri $uri/ /index.html;

        }
    }
}