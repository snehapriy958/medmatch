global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alerts.yaml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "ai-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ai-service.medmatch.svc.cluster.local:8000"]
        labels:
          app: medmatch
          component: ai-service
          environment: production

  - job_name: "auth-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["auth-service.medmatch.svc.cluster.local:8081"]
        labels:
          app: medmatch
          component: auth-service
          environment: production
