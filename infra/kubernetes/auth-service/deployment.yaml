apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: medmatch

  labels:
    app: medmatch
    component: auth-service
    environment: production


spec:
  revisionHistoryLimit: 3

  replicas: 2


  selector:

    matchLabels:
      app: medmatch
      component: auth-service



  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxSurge: 1

      maxUnavailable: 0




  template:

    metadata:

      labels:
        app: medmatch
        component: auth-service
        environment: production



    spec:

      serviceAccountName: auth-service-sa



      containers:


        - name: medmatch-auth


          image: medmatch/auth-service:v13

          imagePullPolicy: Never



          ports:

            - containerPort: 8081

              name: http





          volumeMounts:

            - name: jwt-keys

              mountPath: /app/keys

              readOnly: true





          envFrom:

            - configMapRef:

                name: medmatch-config





          env:


            - name: SPRING_PROFILES_ACTIVE

              valueFrom:

                configMapKeyRef:

                  name: medmatch-config

                  key: APPLICATION_PROFILE





            - name: SPRING_DATASOURCE_URL

              value: "jdbc:postgresql://postgres-service.medmatch.svc.cluster.local:5432/medmatch"





            - name: SPRING_DATASOURCE_USERNAME

              valueFrom:

                secretKeyRef:

                  name: medmatch-secrets

                  key: DATABASE_USERNAME





            - name: SPRING_DATASOURCE_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: medmatch-secrets

                  key: DATABASE_PASSWORD





            - name: SPRING_REDIS_HOST

              valueFrom:

                configMapKeyRef:

                  name: medmatch-config

                  key: REDIS_HOST





            - name: SPRING_REDIS_PORT

              valueFrom:

                configMapKeyRef:

                  name: medmatch-config

                  key: REDIS_PORT





          resources:


            requests:

              cpu: "250m"

              memory: "512Mi"



            limits:

              cpu: "1"

              memory: "1Gi"





          securityContext:


            runAsNonRoot: true

            runAsUser: 1000

            allowPrivilegeEscalation: false

            readOnlyRootFilesystem: false


            capabilities:

              drop:

                - ALL






          livenessProbe:


            httpGet:

              path: /actuator/health

              port: 8081


            initialDelaySeconds: 45

            periodSeconds: 15

            timeoutSeconds: 5

            failureThreshold: 3





          readinessProbe:


            httpGet:

              path: /actuator/health

              port: 8081


            initialDelaySeconds: 20

            periodSeconds: 10

            timeoutSeconds: 5

            failureThreshold: 3






      volumes:


        - name: jwt-keys


          secret:

            secretName: medmatch-secrets


            items:


              - key: JWT_PRIVATE_KEY

                path: private.pem



              - key: JWT_PUBLIC_KEY

                path: public.pem
