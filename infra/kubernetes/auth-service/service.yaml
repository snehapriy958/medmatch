apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: medmatch
  labels:
    app: medmatch
    component: auth-service
    environment: production
spec:
  # Default ClusterIP — internal-only. Reached by the frontend (via the
  # Ingress /api route) and, indirectly, by anything calling back into auth
  # for token validation. Never exposed directly outside the cluster; all
  # external traffic comes in through ingress.yaml.
  type: ClusterIP
  selector:
    app: medmatch
    component: auth-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081