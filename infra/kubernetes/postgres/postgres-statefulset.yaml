apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  namespace: medmatch

  labels:
    app: medmatch
    component: postgres
    environment: production

spec:

  serviceName: postgres-service

  replicas: 1

  selector:
    matchLabels:
      app: medmatch
      component: postgres

  template:

    metadata:

      labels:
        app: medmatch
        component: postgres
        environment: production

    spec:
      serviceAccountName: postgres-sa

      terminationGracePeriodSeconds: 30

      securityContext:
        fsGroup: 999


      containers:

        - name: postgres

          image: pgvector/pgvector:pg17

          ports:

            - containerPort: 5432
              name: postgres


          env:

            # Database name

            - name: POSTGRES_DB

              valueFrom:

                configMapKeyRef:

                  name: medmatch-config

                  key: DATABASE_NAME


            # Database username

            - name: POSTGRES_USER

              valueFrom:

                secretKeyRef:

                  name: medmatch-secrets

                  key: DATABASE_USERNAME


            # Database password

            - name: POSTGRES_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: medmatch-secrets

                  key: DATABASE_PASSWORD


            # PostgreSQL data directory

            - name: PGDATA

              value: /var/lib/postgresql/data/pgdata



          volumeMounts:

            # Persistent database storage

            - name: postgres-storage

              mountPath: /var/lib/postgresql/data


            # Initialize pgvector extension

            - name: postgres-init

              mountPath: /docker-entrypoint-initdb.d



          resources:

            requests:

              cpu: "250m"

              memory: "512Mi"


            limits:

              cpu: "1"

              memory: "2Gi"



          securityContext:

            runAsNonRoot: true

            runAsUser: 999

            allowPrivilegeEscalation: false

            readOnlyRootFilesystem: false

            capabilities:

              drop:

                - ALL



          livenessProbe:

            exec:

              command:

                - pg_isready

                - -U
                - "$(POSTGRES_USER)"
                - -d
                - "$(POSTGRES_DB)"

            initialDelaySeconds: 30

            periodSeconds: 15

            timeoutSeconds: 5

            failureThreshold: 5



          readinessProbe:

            exec:

              command:

                - pg_isready

                - -U
                - "$(POSTGRES_USER)"
                - -d
                - "$(POSTGRES_DB)"

            initialDelaySeconds: 10

            periodSeconds: 10

            timeoutSeconds: 5

            failureThreshold: 3



      volumes:

        # pgvector initialization

        - name: postgres-init

          configMap:

            name: postgres-init



  volumeClaimTemplates:


    - metadata:

        name: postgres-storage

        labels:

          app: medmatch

          component: postgres


      spec:
        

        storageClassName: medmatch-storage

        accessModes:

          - ReadWriteOnce


        resources:

          requests:

            storage: 20Gi