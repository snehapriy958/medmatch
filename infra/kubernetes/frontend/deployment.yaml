apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: medmatch

  labels:
    app: medmatch
    component: frontend
    environment: production


spec:

  revisionHistoryLimit: 3
  replicas: 1


  selector:

    matchLabels:

      app: medmatch
      component: frontend


  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxSurge: 1

      maxUnavailable: 0


  template:

    metadata:

      labels:

        app: medmatch
        component: frontend
        environment: production


    spec:
      serviceAccountName: frontend-sa

      initContainers:

        - name: nginx-temp-init

          image: busybox

          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/nginx/client_temp
              mkdir -p /tmp/nginx/proxy_temp

              mkdir -p /var/cache/nginx/client_temp
              mkdir -p /var/cache/nginx/proxy_temp
              mkdir -p /var/cache/nginx/fastcgi_temp
              mkdir -p /var/cache/nginx/uwsgi_temp
              mkdir -p /var/cache/nginx/scgi_temp

              chown -R 101:101 /tmp/nginx
              chown -R 101:101 /var/cache/nginx

          volumeMounts:

              - name: tmp
                mountPath: /tmp
              
              - name: cache
                mountPath: /var/cache

      containers:

        - name: medmatch-ui

          image: medmatch/frontend:latest
          imagePullPolicy: Never


          ports:

            - containerPort: 5173

              name: http



          resources:

            requests:

              cpu: "100m"

              memory: "256Mi"


            limits:

              cpu: "500m"

              memory: "512Mi"



          securityContext:

            runAsNonRoot: true

            runAsUser: 101

            allowPrivilegeEscalation: false

            readOnlyRootFilesystem: true

            capabilities:

              drop:

                - ALL



          livenessProbe:

            httpGet:

              path: /

              port: 5173


            initialDelaySeconds: 15

            periodSeconds: 15

            timeoutSeconds: 5

            failureThreshold: 3



          readinessProbe:

            httpGet:

              path: /

              port: 5173


            initialDelaySeconds: 5

            periodSeconds: 10

            timeoutSeconds: 5

            failureThreshold: 3



          volumeMounts:

            - name: cache

              mountPath: /var/cache


            - name: tmp

              mountPath: /tmp



      volumes:

        - name: cache

          emptyDir: {}


        - name: tmp

          emptyDir: {}