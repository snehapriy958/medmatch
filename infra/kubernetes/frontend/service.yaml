apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: medmatch
  labels:
    app: medmatch
    component: frontend
    environment: production
spec:
  # Internal-only ClusterIP. External users never hit this directly — all
  # traffic arrives through ingress.yaml's "/" rule, which forwards here.
  type: ClusterIP
  selector:
    app: medmatch
    component: frontend
  ports:
    - name: http
      port: 5173
      targetPort: 5173