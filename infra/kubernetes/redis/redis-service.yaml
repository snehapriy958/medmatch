apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: medmatch
  labels:
    app: medmatch
    component: redis
    environment: production
spec:
  # Headless service (no ClusterIP) — required for StatefulSets, same
  # rationale as postgres-service.yaml: stable per-pod DNS
  #   redis-0.redis-service.medmatch.svc.cluster.local
  # rather than load-balanced routing across replicas.
  type: ClusterIP
  selector:
    app: medmatch
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379