apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-service-monitor
  namespace: medmatch
  labels:
    app: medmatch
    component: auth-service
    environment: production
spec:
  namespaceSelector:
    matchNames:
      - medmatch
  selector:
    matchLabels:
      app: medmatch
      component: auth-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-service-monitor
  namespace: medmatch
  labels:
    app: medmatch
    component: ai-service
    environment: production
spec:
  namespaceSelector:
    matchNames:
      - medmatch
  selector:
    matchLabels:
      app: medmatch
      component: ai-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s