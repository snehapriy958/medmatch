apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-service
  namespace: medmatch
  labels:
    app: medmatch
    component: ai-service
    environment: production

spec:
  revisionHistoryLimit: 3
  replicas: 1

  selector:
    matchLabels:
      app: medmatch
      component: ai-service

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: medmatch
        component: ai-service
        environment: production

    spec:
      serviceAccountName: ai-service-sa

      containers:

        - name: medmatch-ai

          image: medmatch/ai-service:v12
          imagePullPolicy: Never

          ports:
            - containerPort: 8000
              name: http

          envFrom:
            - configMapRef:
                name: medmatch-config

          env:
            - name: HF_HOME
              value: /tmp/huggingface

            - name: TRANSFORMERS_CACHE
              value: /tmp/huggingface

            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: medmatch-secrets
                  key: DATABASE_URL


            # Redis
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: medmatch-config
                  key: REDIS_HOST

            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: medmatch-config
                  key: REDIS_PORT


            # Gemini API
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: medmatch-secrets
                  key: LLM_API_KEY


            # JWT
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: medmatch-secrets
                  key: JWT_PUBLIC_KEY


          resources:

            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "1"
              memory: "1Gi"


          securityContext:

            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

            capabilities:
              drop:
                - ALL


          livenessProbe:

            httpGet:
              path: /api/health/live
              port: 8000

            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3


          readinessProbe:

            httpGet:
              path: /api/health/ready
              port: 8000

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3


          volumeMounts:

            - name: tmp
              mountPath: /tmp
            - name: uploads
              mountPath: /app/uploads

      volumes:

        - name: tmp
          emptyDir: {}

        - name: uploads
          persistentVolumeClaim:
            claimName: medmatch-uploads-pvc
