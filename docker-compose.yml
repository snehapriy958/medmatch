name: medmatch

services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: medmatch-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - medmatch-network

  redis:
    image: redis:8-alpine
    container_name: medmatch-redis

    ports:
      - "${REDIS_PORT}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - medmatch-network

  auth-service:
    init: true
    image: medmatch/auth-service:latest

    build:
      context: ./services/auth-service
      dockerfile: Dockerfile

    container_name: medmatch-auth

    env_file:
      - ./services/auth-service/.env.docker

    ports:
      - "${AUTH_PORT}:8081"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: unless-stopped
    stop_grace_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - medmatch-network

  ai-service:
    init: true
    image: medmatch/ai-service:latest

    build:
      context: ./services/ai-service
      dockerfile: Dockerfile

    container_name: medmatch-ai

    env_file:
      - ./services/ai-service/.env.docker

    ports:
      - "${AI_PORT}:8000"

    volumes:
      - ai_uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy
      

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: unless-stopped
    stop_grace_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - medmatch-network

  alertmanager:
    image: prom/alertmanager:v0.28.1

    container_name: medmatch-alertmanager

    ports:
      - "9093:9093"

    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - medmatch-network

  celery-worker:
    init: true
    image: medmatch/ai-service:latest

    build:
      context: ./services/ai-service
      dockerfile: Dockerfile

    container_name: medmatch-worker

    command: celery -A app.celery.celery_app worker --loglevel=info

    env_file:
      - ./services/ai-service/.env.docker

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy
      
      ai-service:
        condition: service_healthy

    volumes:
      - ai_uploads:/app/uploads

    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        [
          "CMD",
          "celery",
          "-A",
          "app.celery.celery_app",
          "inspect",
          "ping"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - medmatch-network

  flower:
    init: true
    image: medmatch/ai-service:latest

    build:
      context: ./services/ai-service
      dockerfile: Dockerfile

    container_name: medmatch-flower

    command: >
      celery
      -A app.celery.celery_app
      flower
      --port=5555

    env_file:
      - ./services/ai-service/.env.docker

    ports:
      - "5555:5555"

    depends_on:
      redis:
        condition: service_healthy

      celery-worker:
        condition: service_healthy

    restart: unless-stopped
    stop_grace_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5555')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - medmatch-network

  frontend:
    init: true
    image: medmatch/frontend:latest

    build:
      context: ./frontend/medmatch-ui
      dockerfile: Dockerfile

    container_name: medmatch-frontend

    ports:
      - "${FRONTEND_PORT}:80"

    depends_on:
      auth-service:
        condition: service_healthy

      ai-service:
        condition: service_healthy

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - medmatch-network

  prometheus:
    image: prom/prometheus:v3.5.0

    container_name: medmatch-prometheus

    ports:
      - "${PROMETHEUS_PORT}:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

    depends_on:
      auth-service:
        condition: service_healthy

      ai-service:
        condition: service_healthy

      alertmanager:
        condition: service_started

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:9090/-/healthy"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - medmatch-network

  grafana:
    image: grafana/grafana:12.1.1

    container_name: medmatch-grafana

    ports:
      - "${GRAFANA_PORT}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - grafana_data:/var/lib/grafana

      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      prometheus:
        condition: service_healthy

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:3000/api/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - medmatch-network

volumes:
  postgres_data:
  ai_uploads:
  prometheus_data:
  grafana_data:

networks:
  medmatch-network:
    driver: bridge