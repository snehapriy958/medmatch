services:

  # ============================================================
  # PostgreSQL + pgvector
  # ============================================================

  postgres:
    image: pgvector/pgvector:pg17

    container_name: medmatch-postgres

    environment:
      POSTGRES_DB: medmatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d medmatch"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ============================================================
  # Redis
  # ============================================================

  redis:
    image: redis:8-alpine

    container_name: medmatch-redis

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ============================================================
  # Spring Boot Auth Service
  # ============================================================

  # ============================================================
  # Auth-service schema migration (Flyway) - one-shot job.
  #
  # Runs V1-V4 in services/auth-service/src/main/resources/db/migration
  # against the shared `medmatch` database, then exits. auth-service
  # itself never uses `condition: service_completed_successfully` as
  # a dependency target - it depends on THIS one-shot job instead, so
  # the long-running app container is never mistaken for a completed
  # migration step.
  # ============================================================

  auth-migrate:
    image: flyway/flyway:10-alpine

    container_name: medmatch-auth-migrate

    command: >
      -url=jdbc:postgresql://postgres:5432/medmatch
      -user=postgres
      -password=${DATABASE_PASSWORD:-postgres}
      -locations=filesystem:/flyway/sql
      -connectRetries=10
      migrate

    volumes:
      - ./services/auth-service/src/main/resources/db/migration:/flyway/sql:ro

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  # ============================================================
  # AI-service schema migration (Alembic) - one-shot job.
  #
  # Runs 0001-0007 in services/ai-service/alembic/versions against
  # the same shared database. Depends on auth-migrate completing
  # first, since patients/trials have FKs into hospitals, which only
  # auth-migrate creates.
  # ============================================================

  ai-migrate:
    build:
      context: .
      dockerfile: infra/docker/ai-service.Dockerfile

    container_name: medmatch-ai-migrate

    command: ["alembic", "upgrade", "head"]

    environment:
      DATABASE_URL: postgresql://postgres:${DATABASE_PASSWORD:-postgres}@postgres:5432/medmatch
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}

    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully

    restart: "no"

  auth-service:
  # keep your existing configuration here

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    build:
      context: .
      dockerfile: infra/docker/auth-service.Dockerfile

    container_name: medmatch-auth

    ports:
      - "8081:8081"

    environment:
      SPRING_PROFILES_ACTIVE: dev

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/medmatch
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    volumes:
      - ./services/auth-service/src/main/resources/keys:/app/keys:ro

    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully

    restart: unless-stopped


  # ============================================================
  # FastAPI AI Service
  # ============================================================

  ai-service:
    build:
      context: .
      dockerfile: infra/docker/ai-service.Dockerfile

    container_name: medmatch-ai

    ports:
      - "8000:8000"

    environment:

      APPLICATION_PROFILE: production

      DATABASE_URL: postgresql://postgres:${DATABASE_PASSWORD:-postgres}@postgres:5432/medmatch
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}

      GOOGLE_API_KEY: ${GOOGLE_API_KEY}

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      HF_HOME: /tmp/huggingface
      TRANSFORMERS_CACHE: /tmp/huggingface

    volumes:
      - ./services/auth-service/src/main/resources/keys:/app/keys:ro
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      ai-migrate:
        condition: service_completed_successfully

    restart: unless-stopped

  # ============================================================
  # Celery Worker
  # ============================================================

  celery-worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile

    container_name: medmatch-worker

    environment:

      APPLICATION_PROFILE: production

      GOOGLE_API_KEY: ${GOOGLE_API_KEY}

      DATABASE_URL: postgresql://postgres:${DATABASE_PASSWORD:-postgres}@postgres:5432/medmatch
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      HF_HOME: /tmp/huggingface
      TRANSFORMERS_CACHE: /tmp/huggingface

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      ai-migrate:
        condition: service_completed_successfully

    restart: unless-stopped

  # ============================================================
  # React + Vite Frontend
  # ============================================================

  frontend:
    depends_on:
      auth-service:
        condition: service_healthy
      ai-service:
        condition: service_started
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_AUTH_API_URL: /api/auth
        VITE_AI_API_URL: /api/ai

    container_name: medmatch-frontend

    ports:
      - "5173:5173"

    restart: unless-stopped


# ==============================================================
# Persistent volumes
# ==============================================================

volumes:

  postgres_data:
    external: true
    name: medmatch_postgres_data

  redis_data:

  uploads_data:
