name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/medmatch-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/medmatch-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  auth-service:
    name: Auth Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test and build
        working-directory: services/auth-service
        run: mvn -B test package -DskipTests=false

  ai-service:
    name: AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: services/ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        working-directory: services/ai-service
        run: python -m compileall app

  repository:
    name: Repository Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository for accidentally tracked secrets
        shell: bash
        run: |
          if git grep -n -I -E \
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AQ\.[A-Za-z0-9_-]{20,}' \
            -- . ':!docs/' ':!*.md'; then
            echo "Potential secret detected."
            exit 1
          fi
