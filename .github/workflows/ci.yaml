name: CI

on:
  push:
    branches: [main, phase-0-2-transfer, "production-readiness/**", "release/**"]
  pull_request:
    branches: [main, phase-0-2-transfer, "production-readiness/**"]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/medmatch-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/medmatch-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  auth-service:
    name: Auth Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Generate Ephemeral RSA Test Keys
        run: |
          mkdir -p services/auth-service/src/main/resources/keys
          openssl genrsa -out services/auth-service/src/main/resources/keys/private.pem 2048
          openssl rsa -in services/auth-service/src/main/resources/keys/private.pem -pubout -out services/auth-service/src/main/resources/keys/public.pem
          chmod 600 services/auth-service/src/main/resources/keys/private.pem

      - name: Test and build
        working-directory: services/auth-service
        run: mvn -B test package -DskipTests=false

  ai-service:
    name: AI Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medmatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/medmatch
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      GOOGLE_API_KEY: test-synthetic-ci-key-12345
      JWT_PUBLIC_KEY_PATH: services/auth-service/src/main/resources/keys/public.pem
      JWT_ALGORITHM: RS256
      ENVIRONMENT: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ai-service/requirements.txt

      - name: Install dependencies
        working-directory: services/ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov anyio

      - name: Generate Ephemeral RSA Test Keys
        run: |
          mkdir -p services/auth-service/src/main/resources/keys
          mkdir -p services/ai-service/keys
          openssl genrsa -out services/auth-service/src/main/resources/keys/private.pem 2048
          openssl rsa -in services/auth-service/src/main/resources/keys/private.pem -pubout -out services/auth-service/src/main/resources/keys/public.pem
          cp services/auth-service/src/main/resources/keys/public.pem services/ai-service/keys/public.pem
          chmod 600 services/auth-service/src/main/resources/keys/private.pem

      - name: Initialize Database Schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d medmatch -c "CREATE EXTENSION IF NOT EXISTS vector;"
          for f in $(ls services/auth-service/src/main/resources/db/migration/V*.sql | sort -V); do
            echo "Applying migration $f..."
            PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d medmatch -f "$f"
          done
          cd services/ai-service
          alembic upgrade head
          cd ../..

      - name: Compile Python sources
        working-directory: services/ai-service
        run: python -m compileall app

      - name: Run AI Service Unit Tests
        env:
          PYTHONPATH: services/ai-service
        run: |
          pytest services/ai-service/tests/ -v

      - name: Run Integration & Security Tests
        env:
          PYTHONPATH: services/ai-service
        run: |
          pytest tests/integration/ tests/security/ -v

  repository:
    name: Repository Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository for accidentally tracked secrets
        shell: bash
        run: |
          if git grep -n -I -E \
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AQ\.[A-Za-z0-9_-]{20,}' \
            -- . ':!docs/' ':!*.md'; then
            echo "Potential secret detected."
            exit 1
          fi
