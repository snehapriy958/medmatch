name: MedMatch CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  auth-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/auth-service

    services:
      postgres:
        image: pgvector/pgvector:pg17

        env:
          POSTGRES_DB: medmatch
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run Tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/medmatch
          DB_USER: postgres
          DB_PASSWORD: postgres
          SPRING_PROFILES_ACTIVE: prod
        run: ./mvnw test

  ai-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/ai-service

    services:
      redis:
        image: redis:8-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test environment
        run: cp .env.docker .env

      - name: Debug configuration
        env:
          REDIS_HOST: localhost
        run: |
          python -c "from app.config.settings import settings; print('REDIS_HOST =', settings.REDIS_HOST)"

      - name: Run Tests
        env:
          REDIS_HOST: localhost
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/medmatch-ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest

    needs:
      - auth-service
      - ai-service
      - frontend

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Images
        run: docker compose build