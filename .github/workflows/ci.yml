name: MedMatch CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  ###########################################################
  # Spring Boot Auth Service
  ###########################################################

  auth-service:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/auth-service

    services:

      postgres:
        image: pgvector/pgvector:pg17

        env:
          POSTGRES_DB: medmatch
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d medmatch"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Generate RSA Keys
        run: |
          mkdir -p src/main/resources/keys

          openssl genrsa \
            -out src/main/resources/keys/private_key.pem \
            2048

          openssl rsa \
            -in src/main/resources/keys/private_key.pem \
            -pubout \
            -out src/main/resources/keys/public_key.pem

      - name: Verify Generated Keys
        run: |
          ls -la src/main/resources/keys
      
      - name: Build & Test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/medmatch
          DB_USER: postgres
          DB_PASSWORD: postgres
          SPRING_PROFILES_ACTIVE: prod

          RSA_PRIVATE_KEY_LOCATION: file:src/main/resources/keys/private_key.pem
          RSA_PUBLIC_KEY_LOCATION: file:src/main/resources/keys/public_key.pem

        run: ./mvnw --batch-mode clean verify

  ###########################################################
  # FastAPI AI Service
  ###########################################################

  ai-service:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/ai-service

    services:

      postgres:
        image: pgvector/pgvector:pg17

        env:
          POSTGRES_DB: medmatch
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d medmatch"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:8-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Environment File
        run: cp .env.docker.example .env

      - name: Run Tests
        env:
          ENVIRONMENT: testing

          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medmatch

          GOOGLE_API_KEY: dummy-key
          LLM_MODEL: gemini-2.5-flash

          REDIS_URL: redis://localhost:6379/0
          REDIS_HOST: localhost
          REDIS_PORT: 6379

        run: pytest -v

  ###########################################################
  # React Frontend
  ###########################################################

  frontend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/medmatch-ui

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/medmatch-ui/package-lock.json

      - name: Install Dependencies
        run: npm ci

      # Uncomment if package.json has a lint script
      #
      # - name: Lint
      #   run: npm run lint

      - name: Build Frontend
        run: npm run build

  ###########################################################
  # Docker Compose
  ###########################################################

  docker:

    runs-on: ubuntu-latest

    needs:
      - auth-service
      - ai-service
      - frontend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Docker environment file
        run: |
          cp services/ai-service/.env.docker.example services/ai-service/.env.docker

      - name: Set dummy Gemini key for Docker
        run: |
          echo "GOOGLE_API_KEY=dummy-key" >> services/ai-service/.env.docker    
      
      - name: Create Compose environment
        run: |
          cat <<EOF > .env
          POSTGRES_DB=medmatch
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_PORT=5434

          REDIS_PORT=6379

          AUTH_PORT=8081
          AI_PORT=8000
          FRONTEND_PORT=80
          SPRING_PROFILES_ACTIVE=prod
          EOF

      - name: Show Compose Environment
        run: cat .env

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build

      - name: Start Docker Stack
        run: docker compose up -d

      - name: Wait for Services
        run: sleep 40

      - name: Show Container Status
        run: docker compose ps

      - name: Check Auth Service
        run: curl --fail http://localhost:8081/health

      - name: Check AI Service
        run: curl --fail http://localhost:8000/api/health

      - name: Show Docker Logs (Failure Only)
        if: failure()
        run: docker compose logs

      - name: Shutdown Docker Stack
        if: always()
        run: docker compose down -v