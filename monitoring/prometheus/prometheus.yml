global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    project: medmatch
    environment: docker

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  - job_name: auth-service

    metrics_path: /actuator/prometheus

    static_configs:
      - targets:
          - auth-service:8081

        labels:
          service: auth-service

  - job_name: ai-service

    metrics_path: /metrics

    static_configs:
      - targets:
          - ai-service:8000

        labels:
          service: ai-service