apiVersion: v1
kind: ConfigMap

metadata:
  name: medmatch-config

data:
  # Spring Boot
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8081"

  DB_URL: "jdbc:postgresql://postgres:5432/medmatch"

  # FastAPI
  APP_NAME: "MedMatch AI Service"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"

  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/medmatch"

  REDIS_URL: "redis://redis:6379/0"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"

  LLM_MODEL: "gemini-2.5-flash"

  TOP_K_RESULTS: "5"
  SIMILARITY_THRESHOLD: "0.75"

  EMBEDDING_CACHE_TTL: "604800"
  RETRIEVAL_CACHE_TTL: "3600"
  LLM_CACHE_TTL: "1800"

  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  DB_POOL_TIMEOUT: "30"

  LOG_LEVEL: "INFO"

  ENABLE_DOCS: "true"
  ENABLE_OPENAPI: "true"

  SEARCH_RATE_LIMIT: "30/minute"
  EVALUATE_RATE_LIMIT: "20/minute"